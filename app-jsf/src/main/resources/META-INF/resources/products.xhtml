<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:p="http://primefaces.org/ui">
<ui:composition template="/template.xhtml">
    <ui:define name="title">Produkte</ui:define>
    <ui:define name="content">
        <h:form id="list">
            <div class="page-head">
                <h1>Produkte</h1>
                <div class="toolbar">
                    <p:inputText id="filter" value="#{productsBean.filter}" placeholder="Suchen …">
                        <p:ajax event="keyup" delay="300" update="table"/>
                    </p:inputText>
                    <p:commandButton value="+ Neues Produkt" icon="pi pi-plus" action="#{productsBean.newProduct}"
                                     update=":dlg:form" oncomplete="PF('productDialog').show()" process="@this"/>
                </div>
            </div>

            <p:dataTable id="table" value="#{productsBean.visible}" var="p" emptyMessage="Keine Produkte gefunden"
                         rowStyleClass="#{p.active ? '' : 'inactive'}">
                <p:column headerText="SKU"><code>#{p.sku}</code></p:column>
                <p:column headerText="Name"><strong>#{p.name}</strong></p:column>
                <p:column headerText="Preis" styleClass="num">#{fmt.money(p.price, p.currency)}</p:column>
                <p:column headerText="Status">
                    <span class="badge badge-#{p.active ? 'success' : 'neutral'}">#{p.active ? 'Aktiv' : 'Inaktiv'}</span>
                </p:column>
                <p:column width="60">
                    <p:commandButton icon="pi pi-pencil" title="Bearbeiten" styleClass="rounded-button ui-button-flat"
                                     action="#{productsBean.edit(p)}" update=":dlg:form"
                                     oncomplete="PF('productDialog').show()" process="@this"/>
                </p:column>
            </p:dataTable>
        </h:form>

        <h:form id="dlg">
            <p:dialog header="Produkt" widgetVar="productDialog" modal="true" resizable="false" width="440">
                <p:outputPanel id="form">
                    <div class="ui-fluid" style="display: grid; gap: 12px">
                        <p:outputLabel for="sku" value="SKU #{productsBean.id != null ? '(nicht änderbar)' : ''}"/>
                        <p:inputText id="sku" value="#{productsBean.sku}" disabled="#{productsBean.id != null}"/>
                        <p:outputLabel for="name" value="Name"/>
                        <p:inputText id="name" value="#{productsBean.name}"/>
                        <p:outputLabel for="price" value="Preis (CHF)"/>
                        <p:inputText id="price" value="#{productsBean.price}"/>
                        <p:selectBooleanCheckbox id="active" value="#{productsBean.active}" itemLabel="Aktiv"/>
                    </div>
                    <div class="actions">
                        <p:commandButton value="Abbrechen" type="button" styleClass="ui-button-secondary"
                                         onclick="PF('productDialog').hide()"/>
                        <p:commandButton value="Speichern" action="#{productsBean.save}"
                                         update=":growl :list:table" process=":dlg:form @this"/>
                    </div>
                </p:outputPanel>
            </p:dialog>
        </h:form>
    </ui:define>
</ui:composition>
</html>
