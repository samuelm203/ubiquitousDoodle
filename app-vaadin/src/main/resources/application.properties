spring.application.name=orders
server.port=${PORT:8080}

# H2 als Datei-Datenbank (bleibt zwischen Neustarts erhalten). Für PostgreSQL: URL/Treiber ersetzen.
spring.datasource.url=jdbc:h2:file:./data/orders;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=

# Schema kommt ausschliesslich aus Flyway-Migrationen; Hibernate prüft nur.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.locations=classpath:db/migration

# Demo-Daten beim ersten Start anlegen
app.demo-data=true

# Firmenkonfiguration: <root>/<firma>/<spalte>.properties (z. B. helvetia-logistik/prod.properties)
app.properties.root=./data/properties
app.properties.demo-data=true

management.endpoints.web.exposure.include=health,info

vaadin.launch-browser=false
